services:
  - type: web
    name: saifee-rovers-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://azizshahdawala.github.io
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FACE_MATCH_THRESHOLD
        value: "0.45"
      - key: EVENT_TIMEZONE_OFFSET_MINUTES
        value: "330"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: EMAIL_FROM
        value: Saifee Rovers <webdevelopment5253@gmail.com>
      - key: EMAIL_FROM_NAME
        value: Saifee Rovers
      - key: EMAIL_FROM_ADDRESS
        value: webdevelopment5253@gmail.com
      - key: CELEBRATION_JOB_SECRET
        sync: false
