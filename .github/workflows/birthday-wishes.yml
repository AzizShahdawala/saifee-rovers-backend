name: Send birthday wishes

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger birthday email job
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-job-secret: ${{ secrets.CELEBRATION_JOB_SECRET }}" \
            https://saifee-rovers-backend.onrender.com/api/celebrations/birthday-wishes
